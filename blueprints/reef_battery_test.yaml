blueprint:
  name: Reef Battery Discharge Test
  description: >
    Schedules a periodic battery-discharge test on a reef-aquarium backup
    system.

    The test runs on the Nth (or last) chosen weekday of every month
    matching the period (e.g. "the last Sunday every 3 months"). When
    the moment arrives, if the chosen person is at home, the user is
    asked for permission via an actionable mobile notification and the
    test waits indefinitely for an explicit answer.

    On approval, the connected breaker is opened for N minutes; the
    battery's SoC, voltage and power are recorded. After the test, a
    summary notification compares the actual discharge with three
    independent indicators: forecast accuracy, voltage profile health,
    and extrapolated full runtime.

    Requires the level-3 hardware: a smart breaker (e.g. Tongou
    TO-Q-SY1-JWT) and the reefbeat-energy-backup service exposing the
    standard MQTT-discovery sensors.

  domain: automation
  source_url: https://github.com/Elwinmage/reefbeatEnergyBackup/blob/main/blueprints/reef_battery_test.yaml

  input:
    # ----------------------------------------------------------------
    # Schedule
    # ----------------------------------------------------------------
    test_time:
      name: Time of day to run the test
      description: >
        Hour and minute when the test should start. Pick a quiet
        period away from feedings.
      default: "14:00:00"
      selector:
        time:

    test_weekday:
      name: Weekday of the test
      default: 6
      selector:
        select:
          options:
            - { label: "Monday",    value: "0" }
            - { label: "Tuesday",   value: "1" }
            - { label: "Wednesday", value: "2" }
            - { label: "Thursday",  value: "3" }
            - { label: "Friday",    value: "4" }
            - { label: "Saturday",  value: "5" }
            - { label: "Sunday",    value: "6" }

    test_weekday_occurrence:
      name: Which occurrence of that weekday
      description: >
        "Last" picks the last matching weekday of the month, useful for
        weekends near month-end. "1st", "2nd"... pick by counting from
        the start of the month.
      default: "last"
      selector:
        select:
          options:
            - { label: "1st",  value: "1" }
            - { label: "2nd",  value: "2" }
            - { label: "3rd",  value: "3" }
            - { label: "4th",  value: "4" }
            - { label: "Last", value: "last" }


    # ----------------------------------------------------------------
    # Pre-conditions
    # ----------------------------------------------------------------
    presence_person:
      name: Person whose presence is required
      description: >
        The test runs only if this person is at home. Prevents the
        test from happening while the house is empty.
      selector:
        entity:
          domain: person

    notify_target:
      name: Mobile notification service
      description: >
        Notification service for prompts and the summary
        (e.g. "mobile_app_pixel_8"). The "notify." prefix is
        added automatically.
      default: "mobile_app"
      selector:
        text:

    # ----------------------------------------------------------------
    # Hardware bindings
    # ----------------------------------------------------------------
    breaker_switch:
      name: Smart breaker switch entity
      description: >
        The Tongou (or compatible) smart breaker that controls the
        mains feed to the reefbeat-energy-backup system.
      selector:
        entity:
          domain: switch

    test_period_months:
      name: Test period (months)
      description: >
        How often the test runs. 1 = every month, 3 = quarterly, 6 = twice a
        year. The period is anchored to January (month % period == 1).

        The value that counts lives on the Raspberry Pi, which publishes it as
        the "Test batterie intervalle" number. This automation always reads it
        from there, and so does the maintenance slider in ha-reef-card.

        Setting this field writes that number -- once, when the automation is
        reloaded, which is what happens as soon as you save this form. It does
        not overwrite the value on every run, so changing the period from the
        card afterwards keeps working.

        Leave it at 0 to write nothing and simply use whatever the service
        already holds.
      default: 0
      selector:
        number:
          min: 0
          max: 12
          step: 1
          mode: slider

    backup_device:
      name: Backup system
      description: >
        The reefbeat-energy-backup device. Every entity this blueprint needs
        -- SoC, voltage, power, and the three maintenance entities -- is
        resolved from it at runtime by looking up the `reef_role` attribute
        the service publishes. Renaming an entity therefore does not break
        the automation.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: "reefbeat⚡Backup"
              model: Energy Backup System

    # ----------------------------------------------------------------
    # Test parameters
    # ----------------------------------------------------------------
    battery_capacity_wh:
      name: Battery capacity (Wh)
      description: >
        Usable battery capacity in watt-hours. For a 24V LiFePO4 pack
        with 80% DoD: capacity_Ah * 25.6 * 0.8. E.g. 60Ah -> 1228 Wh.
      default: 1228
      selector:
        number:
          min: 100
          max: 20000
          step: 1
          unit_of_measurement: Wh

    test_duration_min:
      name: Test duration (minutes)
      description: >
        How long to keep the breaker open. Default 40 min is long
        enough to see meaningful discharge but short enough to be
        safe on a healthy battery.
      default: 40
      selector:
        number:
          min: 5
          max: 180
          step: 5
          unit_of_measurement: min

    soc_drop_tolerance_pct:
      name: Acceptable forecast deviation (% SoC)
      description: >
        If the observed SoC drop differs from the forecast by more
        than this value, the test result is flagged as anomalous.
      default: 3
      selector:
        number:
          min: 1
          max: 20
          unit_of_measurement: "%"

    voltage_floor_v:
      name: Emergency voltage floor (V)
      description: >
        If battery voltage drops below this value during the test,
        the breaker is closed immediately to abort. Set safely above
        your battery's low-voltage cutoff.
      default: 24.0
      selector:
        number:
          min: 20.0
          max: 26.0
          step: 0.1
          unit_of_measurement: V

    voltage_plateau_min_v:
      name: Healthy LFP plateau lower bound (V)
      description: >
        For a small SoC drop, a healthy LiFePO4 pack should stay
        above this voltage. Defaults to 25.6 V (the high end of the
        knee region for a 24V 8S pack).
      default: 25.6
      selector:
        number:
          min: 24.0
          max: 27.0
          step: 0.1
          unit_of_measurement: V

    # ----------------------------------------------------------------
    # Pump command test (optional, quick functional check)
    # ----------------------------------------------------------------
    run_pump_command_test:
      name: Verify pump commands before the discharge test
      description: >
        Before opening the breaker, briefly switch the pumps to the
        service's functional test level (reduced speed, and one pump off
        if you configured per_device), hold it for a few seconds so you
        can confirm the pumps actually react, then restore them. This
        checks the control path end-to-end. No outage needed for this
        step. Requires 'test_level' configured in the service and the
        "Test commandes pompes" switch entity.
      default: false
      selector:
        boolean:

    pump_test_hold_seconds:
      name: How long to hold the test level (seconds)
      description: >
        Time to keep the pumps at the test level so you can observe the
        speed change / pump-off before they are restored.
      default: 15
      selector:
        number:
          min: 3
          max: 120
          step: 1
          unit_of_measurement: s

    wifi_cut_minutes:
      name: Wi-Fi cut during test (minutes, 0 = none)
      description: >
        Optionally cut the Pi's Wi-Fi for this many minutes during the
        test to observe the network failover (client → rejoin → hotspot)
        and the notification path. 0 disables it. The link is always
        restored automatically, even if the cut value is left non-zero, and
        the number entity returns to 0 on its own once it is back.
      default: 0
      selector:
        number:
          min: 0
          max: 30
          step: 1
          unit_of_measurement: min


# Variables propagate the inputs so subsequent steps can read them
# through plain Jinja templates -- !input cannot be used directly
# inside {{ }} expressions in actions/conditions.
variables:
  v_test_weekday: !input test_weekday
  v_test_weekday_occurrence: !input test_weekday_occurrence
  v_backup_device: !input backup_device

  # Entities are resolved by `reef_role` rather than by entity_id: the service
  # publishes that marker on each one, so a user renaming "Tension batterie"
  # cannot silently break the test. An explicit loop is used instead of a
  # select() filter to stay compatible with older Home Assistant versions.
  v_soc_sensor_id: >-
    {%- set ns = namespace(found='') -%}
    {%- for e in device_entities(v_backup_device) -%}
      {%- if state_attr(e, 'reef_role') == 'battery_soc' -%}
        {%- set ns.found = e -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.found }}
  v_voltage_sensor_id: >-
    {%- set ns = namespace(found='') -%}
    {%- for e in device_entities(v_backup_device) -%}
      {%- if state_attr(e, 'reef_role') == 'battery_voltage' -%}
        {%- set ns.found = e -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.found }}
  v_power_sensor_id: >-
    {%- set ns = namespace(found='') -%}
    {%- for e in device_entities(v_backup_device) -%}
      {%- if state_attr(e, 'reef_role') == 'battery_power' -%}
        {%- set ns.found = e -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.found }}
  v_maintenance_button: >-
    {%- set ns = namespace(found='') -%}
    {%- for e in device_entities(v_backup_device) -%}
      {%- if state_attr(e, 'reef_role') == 'maint_battery_discharge_test' -%}
        {%- set ns.found = e -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.found }}
  v_test_period_entity: >-
    {%- set ns = namespace(found='') -%}
    {%- for e in device_entities(v_backup_device) -%}
      {%- if state_attr(e, 'reef_role')
             == 'maint_battery_discharge_test_interval_months' -%}
        {%- set ns.found = e -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.found }}
  v_maintenance_notify_switch: >-
    {%- set ns = namespace(found='') -%}
    {%- for e in device_entities(v_backup_device) -%}
      {%- if state_attr(e, 'reef_role')
             == 'maint_battery_discharge_test_notify' -%}
        {%- set ns.found = e -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.found }}

  # Only ever written to the service, never read back from here: the Pi holds
  # the reference value.
  v_test_period_setpoint: !input test_period_months

  # Always read from the service. Falls back to quarterly when it is down or
  # the entity is unavailable, so the month condition can never divide by zero.
  v_test_period_months: >-
    {{ states(v_test_period_entity) | int(3) }}
  v_test_duration_min: !input test_duration_min
  v_soc_drop_tolerance_pct: !input soc_drop_tolerance_pct
  v_voltage_floor_v: !input voltage_floor_v
  v_voltage_plateau_min_v: !input voltage_plateau_min_v
  v_battery_capacity_wh: !input battery_capacity_wh
  v_notify_target: !input notify_target
  v_use_test_plan: !input run_pump_command_test
  v_test_plan_switch_id: >-
    {%- set ns = namespace(found='') -%}
    {%- for e in device_entities(v_backup_device) -%}
      {%- if state_attr(e, 'reef_role') == 'test_plan' -%}
        {%- set ns.found = e -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.found }}
  v_pump_test_hold_s: !input pump_test_hold_seconds
  v_wifi_cut_minutes: !input wifi_cut_minutes
  v_wifi_cut_number_id: >-
    {%- set ns = namespace(found='') -%}
    {%- for e in device_entities(v_backup_device) -%}
      {%- if state_attr(e, 'reef_role') == 'wifi_cut_min' -%}
        {%- set ns.found = e -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.found }}

trigger:
  # Fire at the chosen time every day; conditions filter for the right
  # day (weekday occurrence within the right month period).
  - platform: time
    at: !input test_time
    id: scheduled

  # Saving this form reloads the automations, which is the one moment the
  # period set above should be written to the service. Doing it on every run
  # instead would silently undo any change made from ha-reef-card.
  - platform: event
    event_type: automation_reloaded
    id: sync

condition:
  # The sync trigger skips every scheduling condition: it does not run a test,
  # it only pushes the period. The action sequence stops right after.
  - condition: or
    conditions:
      - condition: trigger
        id: sync
      - condition: and
        conditions:
          # 1. Right weekday?
          - condition: template
            value_template: "{{ now().weekday() == (v_test_weekday | int) }}"

          # 2. Right occurrence of that weekday in the month?
          #
          # For 1st / 2nd / 3rd / 4th: the day-of-month falls in
          #   [(N-1)*7 + 1 ... N*7]
          # For "last": no other matching weekday remains in the month, i.e.
          #   day + 7 > days_in_month.
          - condition: template
            value_template: >-
              {%- set today = now().day -%}
              {%- set month = now().month -%}
              {%- set year = now().year -%}
              {# Compute how many days in the current month #}
              {%- set next_month = month + 1 if month < 12 else 1 -%}
              {%- set next_year = year if month < 12 else year + 1 -%}
              {%- set last_of_month_ts =
                    as_timestamp(strptime(
                      '%d-%02d-01' | format(next_year, next_month),
                      '%Y-%m-%d')) - 86400 -%}
              {%- set days_in_month = last_of_month_ts | timestamp_custom('%d') | int -%}
              {%- if v_test_weekday_occurrence == 'last' -%}
                {{ today + 7 > days_in_month }}
              {%- else -%}
                {%- set n = v_test_weekday_occurrence | int -%}
                {{ ((n - 1) * 7 + 1) <= today <= (n * 7) }}
              {%- endif -%}

          # 3. Right month within the period?
          # E.g. period=3 -> only run in months 1, 4, 7, 10.
          - condition: template
            value_template: >-
              {%- set period = v_test_period_months | int(3) -%}
              {%- set period = period if period > 0 else 3 -%}
              {{ ((now().month - 1) % period) == 0 }}

          # 4. Person at home (safety: never run a test in an empty house).
          - condition: state
            entity_id: !input presence_person
            state: home

action:
  # ------------------------------------------------------------------
  # 1. Ask the user to confirm
  # ------------------------------------------------------------------
  - alias: On reload, write the configured period to the service and stop
    # 0 means "leave the service alone". The comparison avoids a pointless
    # MQTT round trip when the value already matches.
    if:
      - condition: trigger
        id: sync
    then:
      - if:
          - condition: template
            value_template: >-
              {{ (v_test_period_setpoint | int(0)) > 0
                 and v_test_period_entity != ''
                 and states(v_test_period_entity) | int(0)
                     != (v_test_period_setpoint | int(0)) }}
        then:
          # Traced in the logbook because this is the one moment the blueprint
          # overrules the card. Reloading the automations after changing the
          # period from ha-reef-card would otherwise revert it with nothing to
          # show for it.
          - service: logbook.log
            data:
              name: "Reef Battery Test"
              message: >-
                Test period written from the blueprint:
                {{ states(v_test_period_entity) | int(0) }} ->
                {{ v_test_period_setpoint | int(0) }} months.
          - service: number.set_value
            target:
              entity_id: "{{ v_test_period_entity }}"
            data:
              value: "{{ v_test_period_setpoint | int(0) }}"
      - stop: "Period synced, no test to run"

  - alias: Send confirmation request
    service: "notify.{{ v_notify_target }}"
    data:
      title: "🔋 Test batterie aquarium"
      message: >-
        Le test de décharge programmé peut démarrer.
        Le secteur sera coupé pendant {{ v_test_duration_min }} minutes.
        Confirmer le lancement ?
      data:
        actions:
          - action: "REEF_TEST_CONFIRM"
            title: "Lancer le test"
          - action: "REEF_TEST_DENY"
            title: "Annuler"
        notification_icon: "mdi:battery-clock"
        # Sticky on Android so the prompt stays until answered.
        # iOS keeps it in Notification Center automatically.
        sticky: "true"
        tag: reef_battery_test_prompt

  - alias: Wait for the user's explicit answer (no timeout)
    # No timeout: the test only runs after explicit user approval, no
    # matter when. If the user wants to cancel, they tap "Annuler".
    # If they ignore the notif, nothing happens until they tap one
    # of the two actions or the next scheduled run replaces the
    # automation state.
    wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: REEF_TEST_CONFIRM
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: REEF_TEST_DENY

  - alias: Abort if user denied
    if:
      - condition: template
        value_template: >-
          {{ wait.trigger.event.data.action == 'REEF_TEST_DENY' }}
    then:
      - service: "notify.{{ v_notify_target }}"
        data:
          title: "🔋 Test batterie annulé"
          message: "Test annulé manuellement."
          data:
            tag: reef_battery_test_summary
      - stop: User declined the test

  # ------------------------------------------------------------------
  # 2. Snapshot pre-test state + compute the forecast
  # ------------------------------------------------------------------
  - variables:
      soc_before: "{{ states(v_soc_sensor_id) | float(0) }}"
      voltage_before: "{{ states(v_voltage_sensor_id) | float(0) }}"
      power_at_start_w: "{{ states(v_power_sensor_id) | float(0) }}"
      test_start_ts: "{{ as_timestamp(now()) }}"
      # Forecast: at the current power draw, how many SoC % will we
      # lose during the test? Assumes the load profile stays roughly
      # stable, which is reasonable because the service only degrades
      # intensity when SoC actually drops -- and we won't drop much
      # in 40 minutes.
      predicted_drop_pct: >-
        {%- set wh_consumed =
              (power_at_start_w | abs) * (v_test_duration_min | float / 60.0) -%}
        {{ ((wh_consumed / (v_battery_capacity_wh | float)) * 100) | round(1) }}

  # ------------------------------------------------------------------
  # 3. Optional: quick pump-command functional check (no outage)
  # ------------------------------------------------------------------
  - alias: Run the pump command test (apply test level, hold, restore)
    if:
      - condition: template
        value_template: >-
          {{ v_use_test_plan and v_test_plan_switch_id != '' }}
    then:
      - alias: Apply the functional test level
        service: switch.turn_on
        target:
          entity_id: "{{ v_test_plan_switch_id }}"
      - alias: Hold so the speed change / pump-off is observable
        delay:
          seconds: "{{ v_pump_test_hold_s | int }}"
      - alias: Restore pumps (turn test mode off)
        service: switch.turn_off
        target:
          entity_id: "{{ v_test_plan_switch_id }}"
      - alias: Give the pumps a moment to settle back before discharge
        delay:
          seconds: 5

  # ------------------------------------------------------------------
  # 4. Run the discharge test
  # ------------------------------------------------------------------
  - alias: Open the breaker (simulate outage)
    service: switch.turn_off
    target:
      entity_id: !input breaker_switch

  - alias: Optionally cut Wi-Fi to exercise the network failover
    if:
      - condition: template
        value_template: >-
          {{ (v_wifi_cut_minutes | float(0)) > 0
             and v_wifi_cut_number_id != '' }}
    then:
      - service: number.set_value
        target:
          entity_id: "{{ v_wifi_cut_number_id }}"
        data:
          value: "{{ v_wifi_cut_minutes }}"

  - alias: Wait for the duration, abort early on voltage floor breach
    # A template trigger rather than numeric_state: the voltage entity is now
    # resolved from the device at runtime, and a trigger's entity_id cannot be
    # templated. wait_for_trigger sits inside the action script, so it can read
    # the variables defined above.
    wait_for_trigger:
      - platform: template
        value_template: >-
          {{ states(v_voltage_sensor_id) | float(999)
             < (v_voltage_floor_v | float) }}
    timeout:
      minutes: !input test_duration_min
    continue_on_timeout: true

  - alias: Close the breaker (resume mains)
    service: switch.turn_on
    target:
      entity_id: !input breaker_switch

  # ------------------------------------------------------------------
  # 5. Three-axis analysis
  # ------------------------------------------------------------------
  - variables:
      aborted_early: "{{ wait.trigger is not none }}"
      soc_after: "{{ states(v_soc_sensor_id) | float(0) }}"
      voltage_after: "{{ states(v_voltage_sensor_id) | float(0) }}"
      soc_drop: "{{ (soc_before - soc_after) | round(1) }}"
      duration_actual_min: >-
        {{ ((as_timestamp(now()) - test_start_ts) / 60) | round(0) }}

      # AXIS 1 - Forecast accuracy:
      # how close is the actual drop to what the running scenario predicted?
      drop_deviation: >-
        {{ (soc_drop - (predicted_drop_pct | float(0))) | abs | round(1) }}
      forecast_ok: >-
        {{ drop_deviation <= (v_soc_drop_tolerance_pct | float) }}

      # AXIS 2 - Voltage profile health:
      # a healthy LiFePO4 pack should stay in the plateau for any small
      # SoC drop. If the voltage already collapsed below the plateau lower
      # bound despite a modest drop, the pack's internal resistance has
      # grown -- typical of a battery nearing end-of-life.
      voltage_profile_ok: >-
        {%- if soc_drop < 30 -%}
          {{ voltage_after >= (v_voltage_plateau_min_v | float) }}
        {%- else -%}
          true
        {%- endif -%}

      # AXIS 3 - Extrapolated full runtime to 20% SoC (the safe floor for
      # LFP cycle life). This is a linear projection -- valid because
      # over 40 minutes at constant load, the curve really is linear.
      extrapolated_runtime_to_20pct_h: >-
        {%- if soc_drop > 0 -%}
          {{ ((soc_after - 20) / soc_drop * duration_actual_min / 60)
              | round(1) }}
        {%- else -%}
          0
        {%- endif -%}

      # Overall verdict combines the three axes; abort overrides everything.
      overall_anomalous: >-
        {{ (not forecast_ok) or (not voltage_profile_ok) }}

  - alias: Mark the maintenance task as done
    # Resets the countdown shown in ha-reef-card. Done before the notification
    # so a failing notify service cannot leave the task looking overdue after
    # a test that actually ran.
    service: button.press
    target:
      entity_id: "{{ v_maintenance_button }}"

  - alias: Log to HA logbook
    service: logbook.log
    data:
      name: "Reef Battery Test"
      message: >-
        Discharge test: {{ soc_drop }}% drop in {{ duration_actual_min }} min,
        forecast {{ "OK" if forecast_ok else "DEV" }} (delta {{ drop_deviation }}%),
        voltage profile {{ "OK" if voltage_profile_ok else "SUSPECT" }},
        extrapolated to 20% SoC: {{ extrapolated_runtime_to_20pct_h }}h.
        {% if aborted_early %}ABORTED on voltage floor.{% endif %}
      domain: automation

  - alias: Skip the summary when the task is muted in the card
    # An aborted test is a safety event, not routine maintenance chatter, so
    # it is reported even when the task is muted.
    condition: template
    value_template: >-
      {{ aborted_early or states(v_maintenance_notify_switch) != 'off' }}

  - alias: Send the summary notification
    service: "notify.{{ v_notify_target }}"
    data:
      title: >-
        {%- if aborted_early -%}
          🛑 Test batterie ARRÊTÉ
        {%- elif overall_anomalous -%}
          ⚠️ Test batterie — anomalie
        {%- else -%}
          ✅ Test batterie OK
        {%- endif -%}
      message: >-
        SoC : {{ soc_before }} % → {{ soc_after }} % (Δ {{ soc_drop }} %)
        sur {{ duration_actual_min }} min.

        📊 Prévision : {{ "OK" if forecast_ok else "ÉCART" }}
        ({{ predicted_drop_pct }} % prévu, écart {{ drop_deviation }} %).

        🔋 Profil tension : {{ "OK" if voltage_profile_ok else "SUSPECT" }}
        (final {{ voltage_after }} V).

        ⏱ Autonomie extrapolée jusqu'à 20 % SoC :
        ~{{ extrapolated_runtime_to_20pct_h }} h.

        {% if aborted_early %}
        ⚠️ Test arrêté prématurément : tension batterie sous le seuil de sécurité.
        {% endif %}
        {% if not voltage_profile_ok and not aborted_early %}
        ⚠️ La tension est descendue sous le plateau LFP malgré une faible décharge — capacité possiblement dégradée.
        {% endif %}
      data:
        tag: reef_battery_test_summary
